name: Verify Ponte Dom languages

on:
  push:
    branches:
      - fix/i18n-consistency-2026-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-i18n.mjs
